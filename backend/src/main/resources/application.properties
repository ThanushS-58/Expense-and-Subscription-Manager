spring.application.name=expense-subscription-manager
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_manager?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:ledgerly-local-development-secret-key-change-this-before-deployment-2026}
app.jwt.expiration-ms=86400000
server.port=8080